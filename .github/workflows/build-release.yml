name: Build and publish Windows executable

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # the real release/libmpv-2.dll, not the LFS pointer

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix zip

      - name: Run resume unit tests
        run: |
          g++ -std=c++17 -Wall -Wextra -I src tests/resume_test.cpp -o resume_test
          ./resume_test

      - name: Build
        run: ./build.sh

      - name: Package (exe + libmpv-2.dll)
        run: |
          mkdir -p dist
          cp build/SshWinPlayer.exe dist/
          cp release/libmpv-2.dll dist/
          cd dist && zip -9 ../SshWinPlayer-win64.zip SshWinPlayer.exe libmpv-2.dll

      - name: Publish release (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "SSH Win Player ${{ github.ref_name }}" \
            --generate-notes \
            SshWinPlayer-win64.zip dist/SshWinPlayer.exe dist/libmpv-2.dll \
          || gh release upload "${{ github.ref_name }}" --clobber \
            SshWinPlayer-win64.zip dist/SshWinPlayer.exe dist/libmpv-2.dll

      - name: Publish rolling prerelease (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build \
            --prerelease \
            --title "Latest build (main)" \
            --notes "Automated build of the latest main branch. For a stable build, prefer a versioned release." \
            SshWinPlayer-win64.zip dist/SshWinPlayer.exe dist/libmpv-2.dll
